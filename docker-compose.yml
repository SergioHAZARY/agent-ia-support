# =============================================================================
# Agent IA de support multicanal — socle d'exécution
# Section 12 du document d'implémentation.
#
#   docker compose --env-file .env up -d
#
# Cible : une VM 4 vCPU / 8 Go. Caddy termine le HTTPS, obligatoire pour les
# webhooks Teams et Google Chat.
# =============================================================================

name: agent-support

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL : configuration, identités, tickets, audit.
  # Deux bases dans la même instance : n8n pour son état interne, agent pour
  # les données métier. Coût marginal nul (cf. §12).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crée la base `agent` et y applique le schéma au tout premier démarrage.
      # Les .sql sont montés hors de initdb.d : c'est init.sh qui les applique,
      # sur la bonne base.
      - ./sql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./sql:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Qdrant : index de la base de connaissances et des cas déjà résolus.
  # Deux collections distinctes, cloisonnées par société via un filtre payload.
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [internal]

  # ---------------------------------------------------------------------------
  # n8n : écoute les canaux, exécute les actions, journalise.
  # Jamais exposé directement — Caddy est devant.
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:1.70.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Identité publique : indispensable pour que les webhooks entrants
      # (Telegram, Teams, Google Chat) pointent sur la bonne URL.
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/

      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Paris}
      TZ: ${TIMEZONE:-Europe/Paris}

      # Chiffrement du coffre de credentials. À sauvegarder hors de la VM :
      # sans cette clé, les credentials d'une sauvegarde sont illisibles.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Pas de N8N_BASIC_AUTH_* : ces variables ont disparu en n8n 1.x.
      # La protection de l'éditeur est assurée par Caddy (voir Caddyfile), et
      # n8n demande la création d'un compte propriétaire au premier accès.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"        # 14 jours d'historique d'exécution

      # Consommés par les workflows via $env
      AGENT_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent
      QDRANT_URL: http://qdrant:6333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_MODEL_CHEAP: ${ANTHROPIC_MODEL_CHEAP:-claude-haiku-4-5-20251001}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro       # imports manuels depuis l'éditeur
    networks: [internal, web]

  # ---------------------------------------------------------------------------
  # Caddy : HTTPS automatique (Let's Encrypt). Seul service exposé.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [n8n]
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_HOST: ${N8N_HOST}
      # Hash bcrypt, généré par :
      #   docker run --rm caddy:2.8-alpine caddy hash-password --plaintext 'motdepasse'
      N8N_ADMIN_USER: ${N8N_ADMIN_USER}
      N8N_ADMIN_PASSWORD_HASH: ${N8N_ADMIN_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  # ---------------------------------------------------------------------------
  # Sauvegarde quotidienne de PostgreSQL. Dès le premier jour (§12).
  # Restauration :  gunzip -c backups/agent-AAAAMMJJ.sql.gz | psql "$AGENT_DB_URL"
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          STAMP=$$(date +%Y%m%d-%H%M)
          for DB in agent n8n; do
            pg_dump -h postgres -U "$$POSTGRES_USER" "$$DB" \
              | gzip > "/backups/$$DB-$$STAMP.sql.gz" \
              && echo "[backup] $$DB-$$STAMP.sql.gz" \
              || echo "[backup] ECHEC $$DB"
          done
          find /backups -name '*.sql.gz' -mtime +$$RETENTION_DAYS -delete
          sleep 86400
        done
    networks: [internal]

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true    # postgres et qdrant ne sont joignables que par n8n
  web:
