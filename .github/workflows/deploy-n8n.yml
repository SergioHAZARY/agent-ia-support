name: Deploy n8n

# Déploie le workflow unique 'AgentSupport - Pipeline' vers n8n cloud à chaque
# push sur main qui touche les fichiers n8n. Reconstruit le JSON depuis git,
# puis l'upsert par nom (jamais de doublon, jamais un workflow hors préfixe).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   N8N_BASE_URL   ex. https://dev-ai.app.n8n.cloud
#   N8N_API_KEY    la clé API n8n
#
# Le workflow est déployé INACTIF ; l'activation reste manuelle dans l'UI,
# une fois les credentials Anthropic et Telegram attachées.

on:
  push:
    branches: [main]
    paths:
      - "n8n/**"
      - "prompts/triage.md"
      - ".github/workflows/deploy-n8n.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Synchroniser le pipeline vers n8n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruire le workflow depuis la source
        run: python n8n/build_pipeline.py

      - name: Déployer vers n8n
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then
            echo "::warning::Secrets n8n absents — déploiement ignoré. Ajoutez N8N_BASE_URL et N8N_API_KEY."
            exit 0
          fi
          python n8n/sync.py
