name: Deploy n8n

# Déploie le workflow unique 'AgentSupport - Pipeline' vers n8n cloud à chaque
# push sur main qui touche les fichiers n8n. Reconstruit le JSON depuis git,
# puis l'upsert par nom (jamais de doublon, jamais un workflow hors préfixe).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   N8N_BASE_URL   ex. https://dev-ai.app.n8n.cloud
#   N8N_API_KEY    la clé API n8n
#
# Le workflow est déployé puis activé (toggle off/on pour re-enregistrer
# les webhooks Telegram). Les variables n8n sont créées si absentes.
#
# Secrets optionnels supplémentaires :
#   CLICKUP_API_TOKEN          (crée la variable n8n pour l'escalade N3)
#   TELEGRAM_ADMIN_BOT_TOKEN   (crée la credential Telegram du bot admin)
#   IMAP_*_USER / IMAP_*_PASS  (credentials IMAP pour chaque boîte Outlook)
#   JIRA_BEAUTYBAY_USER/TOKEN  (credential Jira BeautyBay HTTP Basic)

on:
  push:
    branches: [main]
    paths:
      - "n8n/**"
      - "prompts/triage.md"
      - ".github/workflows/deploy-n8n.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Synchroniser le pipeline vers n8n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Déployer vers n8n (credentials + variables + build + workflow + activation)
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          # IMAP Outlook (un couple USER/PASS par boîte)
          IMAP_BAZARCHIC_USER: ${{ secrets.IMAP_BAZARCHIC_USER }}
          IMAP_BAZARCHIC_PASS: ${{ secrets.IMAP_BAZARCHIC_PASS }}
          IMAP_BEAUTYBAY_USER: ${{ secrets.IMAP_BEAUTYBAY_USER }}
          IMAP_BEAUTYBAY_PASS: ${{ secrets.IMAP_BEAUTYBAY_PASS }}
          IMAP_ATLASFORMEN_USER: ${{ secrets.IMAP_ATLASFORMEN_USER }}
          IMAP_ATLASFORMEN_PASS: ${{ secrets.IMAP_ATLASFORMEN_PASS }}
          IMAP_FSAGET_USER: ${{ secrets.IMAP_FSAGET_USER }}
          IMAP_FSAGET_PASS: ${{ secrets.IMAP_FSAGET_PASS }}
          IMAP_REGARDBEAUTY_USER: ${{ secrets.IMAP_REGARDBEAUTY_USER }}
          IMAP_REGARDBEAUTY_PASS: ${{ secrets.IMAP_REGARDBEAUTY_PASS }}
          # Jira BeautyBay
          JIRA_BEAUTYBAY_USER: ${{ secrets.JIRA_BEAUTYBAY_USER }}
          JIRA_BEAUTYBAY_TOKEN: ${{ secrets.JIRA_BEAUTYBAY_TOKEN }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then
            echo "::warning::Secrets n8n absents — déploiement ignoré. Ajoutez N8N_BASE_URL et N8N_API_KEY."
            exit 0
          fi
          python n8n/deploy_full.py
